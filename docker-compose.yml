services:
  users_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: users_service
    restart: unless-stopped
    environment:
      USERS_DB_PATH: /data/users.db
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL in .env}
    volumes:
      - users_data:/data
    ports:
      - "8001:8001"

volumes:
  users_data:
