services:
  users_nginx:
    image: nginx:1.27-alpine
    container_name: users_nginx
    restart: unless-stopped
    ports:
      - "${USERS_NGINX_PORT:-8080}:8080"
    environment:
      USERS_SERVICE_HOST: ${USERS_SERVICE_HOST:-users_service}
      USERS_SERVICE_PORT: ${USERS_SERVICE_PORT:-8001}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - users_service

  users_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: users_service
    restart: unless-stopped
    environment:
      USERS_DB_PATH: /data/users.db
    volumes:
      - users_data:/data
    expose:
      - "8001"

volumes:
  users_data:
